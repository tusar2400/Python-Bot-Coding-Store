<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Python Bot Coding Store</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background-color: #070e18; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .card { background-color: #0d1726; border: 1px solid #1a273e; }
    .btn-buy { background: linear-gradient(135deg, #f59e0b, #d97706); }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="p-3 max-w-md mx-auto pb-24 text-slate-200">

  <!-- ==================== হেডার (লোগো, ইউজার DP এবং ব্যালেন্স) ==================== -->
  <header class="flex justify-between items-center py-2.5 mb-3 border-b border-slate-800/80">
    <!-- বাম পাশের লোগো -->
    <div class="flex items-center space-x-2">
      <div id="store-logo-box" class="w-10 h-10 rounded-full bg-emerald-500/20 text-emerald-400 flex items-center justify-center border border-emerald-500/40 overflow-hidden shadow-lg">
        <i id="default-logo-icon" class="fa-solid fa-code text-base"></i>
        <img id="store-logo-img" class="hidden w-full h-full object-cover">
      </div>
      <div>
        <h1 class="text-xs font-black text-white tracking-wider flex items-center">
          PYTHON BOT <span class="text-emerald-400 ml-1">STORE</span>
        </h1>
        <p id="user-display-name" class="text-[10px] text-slate-400 font-semibold truncate max-w-[90px]">User</p>
      </div>
    </div>

    <!-- ডান পাশের ব্যালেন্স ও টেলিগ্রাম আসল প্রোফাইল ছবি -->
    <div class="flex items-center space-x-2">
      <button class="w-8 h-8 rounded-full bg-slate-800 text-slate-300 flex items-center justify-center text-xs border border-slate-700">
        <i class="fa-regular fa-bell"></i>
      </button>

      <!-- ব্যালেন্স বাটন -->
      <div class="bg-emerald-500/20 text-emerald-400 border border-emerald-500/40 px-2.5 py-1 rounded-full text-xs font-bold flex items-center space-x-1 shadow">
        <i class="fa-solid fa-wallet text-[10px]"></i>
        <span id="user-balance-badge">৳0</span>
      </div>

      <!-- ইউজারের টেলিগ্রাম প্রোফাইল ছবি (ডাইনামিক) -->
      <div id="tg-avatar-box" class="w-9 h-9 rounded-full bg-slate-800 border-2 border-emerald-500 overflow-hidden flex items-center justify-center font-bold text-xs text-white">
        <span id="tg-avatar-letter">U</span>
        <img id="tg-avatar-img" class="hidden w-full h-full object-cover">
      </div>
    </div>
  </header>

  <!-- সোর্স কোড জোন ব্যানার -->
  <div class="card p-2 rounded-xl mb-3 flex items-center justify-between bg-gradient-to-r from-cyan-950/40 to-slate-900 border-slate-800">
    <div class="flex items-center space-x-2">
      <button class="w-7 h-7 rounded-lg bg-slate-800 text-slate-400 flex items-center justify-center text-xs">
        <i class="fa-solid fa-arrow-left"></i>
      </button>
      <span class="text-xs font-black text-white flex items-center tracking-wide">
        <i class="fa-solid fa-code text-cyan-400 mr-1.5"></i> SOURCE CODE ZONE
      </span>
    </div>
    <span class="text-[9px] bg-cyan-500/20 text-cyan-400 font-black px-2 py-0.5 rounded-md border border-cyan-500/30">&lt;PRO/&gt;</span>
  </div>

  <!-- ফিল্টার ক্যাটাগরি -->
  <div class="flex space-x-2 mb-3 text-[11px] font-bold overflow-x-auto hide-scrollbar py-1">
    <button class="px-4 py-1.5 rounded-xl bg-cyan-500 text-white shadow">ALL</button>
    <button class="px-4 py-1.5 rounded-xl bg-slate-800 text-slate-400 border border-slate-700">FREE CODE</button>
    <button class="px-4 py-1.5 rounded-xl bg-slate-800 text-slate-400 border border-slate-700">PAID CODE</button>
  </div>

  <!-- ==================== প্রোডাক্ট তালিকা ==================== -->
  <div id="product-container" class="space-y-3.5">
    <!-- ডাইনামিক প্রোডাক্ট এখানে লোড হবে -->
  </div>

  <!-- ==================== নিচের ন্যাভিগেশন মেনুবার ==================== -->
  <nav class="fixed bottom-0 left-0 right-0 bg-[#070e18]/95 backdrop-blur-md border-t border-slate-800 py-2 px-4 z-40 max-w-md mx-auto">
    <div class="flex justify-between items-center text-center text-[10px] font-semibold text-slate-400">
      <button class="text-emerald-400 flex flex-col items-center">
        <i class="fa-solid fa-house text-sm mb-1"></i>
        <span>HOME</span>
      </button>
      <button class="hover:text-emerald-400 flex flex-col items-center">
        <i class="fa-solid fa-code text-sm mb-1"></i>
        <span>TOOLS</span>
      </button>
      <button class="hover:text-emerald-400 flex flex-col items-center">
        <i class="fa-solid fa-wallet text-sm mb-1"></i>
        <span>WALLET</span>
      </button>
      <button class="hover:text-emerald-400 flex flex-col items-center">
        <i class="fa-solid fa-robot text-sm mb-1"></i>
        <span>MOD APK</span>
      </button>
      <button class="hover:text-emerald-400 flex flex-col items-center">
        <i class="fa-solid fa-user text-sm mb-1"></i>
        <span>MY PROFILE</span>
      </button>
    </div>
  </nav>

  <script>
    // টেলিগ্রাম ওয়েব অ্যাপ ইনিশিয়ালাইজেশন
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    // ইউজারের প্রোফাইল সেট করা
    function initUserProfile() {
      const user = tg?.initDataUnsafe?.user;
      if (user) {
        document.getElementById("user-display-name").innerText = user.first_name || "User";
        
        // যদি প্রোফাইল ছবি থাকে
        if (user.photo_url) {
          const img = document.getElementById("tg-avatar-img");
          img.src = user.photo_url;
          img.classList.remove("hidden");
          document.getElementById("tg-avatar-letter").classList.add("hidden");
        } else {
          document.getElementById("tg-avatar-letter").innerText = (user.first_name || "U")[0].toUpperCase();
        }
      }

      // অ্যাডমিন প্যানেল থেকে সেভ করা স্টোর লোগো লোড করা
      const savedLogo = localStorage.getItem("store_app_logo");
      if (savedLogo) {
        const logoImg = document.getElementById("store-logo-img");
        logoImg.src = savedLogo;
        logoImg.classList.remove("hidden");
        document.getElementById("default-logo-icon").classList.add("hidden");
      }
    }

    // প্রোডাক্ট লোড করা
    function renderProducts() {
      const container = document.getElementById("product-container");
      const prods = JSON.parse(localStorage.getItem("store_products")) || [
        {
          id: "p1",
          title: "MINO SMS NUMBER BOT",
          price: 125,
          dollarPrice: 1.0,
          logo: "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=120&auto=format&fit=crop&q=80",
          description: "MINO SMS NUMBER BOT . সমস্ত সিস্টেম অটোমেটিক বট এড করে নিবে আপনাকে শুধু এই প্যানেল এর Api key এড করে দিতে হবে।",
          status: "active"
        },
        {
          id: "p2",
          title: "ALL PANEL NUMBER BOT (TG & OTP)",
          price: 600,
          dollarPrice: 4.8,
          logo: "https://images.unsplash.com/photo-1634017839464-5c339ebe3cb4?w=120&auto=format&fit=crop&q=80",
          description: "CREATE PREMIUM TELEGRAM NUMBER AND OTP BOT ALL PANEL SUPPORT BOT.",
          status: "active"
        }
      ];

      container.innerHTML = "";
      prods.filter(p => p.status !== 'inactive').forEach(p => {
        container.innerHTML += `
          <div class="card p-3 rounded-2xl shadow-xl space-y-2.5">
            <div class="flex items-center space-x-3">
              <img src="${p.logo}" class="w-12 h-12 rounded-xl object-cover border border-slate-700">
              <div class="flex-1 min-w-0">
                <div class="flex justify-between items-start">
                  <h3 class="font-bold text-white text-xs truncate">${p.title}</h3>
                  <span class="text-[9px] bg-amber-500/20 text-amber-400 font-bold px-1.5 py-0.5 rounded border border-amber-500/30 shrink-0 ml-1">
                    ${p.isFree ? 'FREE CODE' : 'PAID CODE'}
                  </span>
                </div>
                <div class="flex items-center space-x-2 mt-1 text-[10px] text-slate-400">
                  <span class="bg-slate-800 px-1.5 py-0.5 rounded text-cyan-400 font-bold"><i class="fa-solid fa-thumbs-up mr-1"></i>2 LIKES</span>
                  <span class="bg-slate-800 px-1.5 py-0.5 rounded text-amber-400 font-bold"><i class="fa-solid fa-cart-shopping mr-1"></i>6 SELL</span>
                </div>
              </div>
            </div>

            <p class="text-[11px] text-slate-400 line-clamp-2 bg-slate-900/60 p-2 rounded-xl border border-slate-800/80">
              ${p.description || "কোন বিবরণ দেওয়া হয়নি।"}
            </p>

            <div class="grid grid-cols-2 gap-2 pt-1">
              <button class="bg-slate-800 text-slate-300 py-2 rounded-xl text-xs font-bold border border-slate-700">Details & View</button>
              <button class="btn-buy text-white py-2 rounded-xl text-xs font-black shadow-lg shadow-amber-500/20">
                Buy ৳${p.price} ($${p.dollarPrice})
              </button>
            </div>
          </div>
        `;
      });
    }

    window.addEventListener("DOMContentLoaded", () => {
      initUserProfile();
      renderProducts();
    });
  </script>
</body>
</html>
