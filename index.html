<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>ELITE ZONE STORE</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    body { background-color: #0b0f19; color: #f1f5f9; font-family: sans-serif; -webkit-tap-highlight-color: transparent; }
    .card-gradient { background: linear-gradient(145deg, #131b2e, #0f172a); border: 1px solid #1e293b; }
    .gold-gradient { background: linear-gradient(90deg, #f59e0b, #d97706); }
    .btn-green { background: linear-gradient(90deg, #10b981, #059669); }
  </style>
</head>
<body class="p-3 pb-24">

  <!-- ==================== FORCE JOIN LOCK SCREEN (বাধ্যতামূলক জয়েন স্ক্রিন) ==================== -->
  <div id="force-join-screen" class="fixed inset-0 bg-[#0b0f19] z-[999] flex flex-col items-center justify-center p-5 text-center hidden">
    <div class="w-16 h-16 rounded-full bg-red-500/10 border border-red-500/30 flex items-center justify-center mb-4 text-red-500 text-2xl shadow-lg">
      <i class="fa-solid fa-lock"></i>
    </div>
    <h2 class="text-base font-bold text-white mb-2">বাধ্যতামূলক চ্যানেল নোটিশ!</h2>
    <p class="text-xs text-gray-400 mb-6 max-w-xs">
      বট ও স্টোর ব্যবহার করতে হলে আপনাকে অবশ্যই আমাদের অফিশিয়াল চ্যানেলে যুক্ত থাকতে হবে।
    </p>

    <div class="w-full max-w-xs space-y-3">
      <a href="https://t.me/DragonTGSupportGroup" target="_blank" class="w-full py-2.5 rounded-xl text-xs font-bold bg-blue-600 hover:bg-blue-500 text-white flex items-center justify-center space-x-2 shadow-lg">
        <i class="fa-brands fa-telegram text-base"></i>
        <span>📢 চ্যানেলে জয়েন করুন</span>
      </a>

      <button onclick="checkMembership(true)" id="verify-btn" class="w-full py-2.5 rounded-xl text-xs font-bold btn-green text-white flex items-center justify-center space-x-2 shadow-lg">
        <i class="fa-solid fa-rotate-right"></i>
        <span>🔄 জয়েন করেছি (Verify)</span>
      </button>
    </div>
  </div>

  <!-- মূল অ্যাপ কনটেন্ট (ভেরিফাই হলে দেখাবে) -->
  <div id="main-app" class="hidden">
    <!-- হেডার ও ওয়ালেট বার -->
    <header class="flex items-center justify-between p-3 rounded-2xl card-gradient mb-4 shadow-lg">
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 rounded-full bg-emerald-500/20 flex items-center justify-center border border-emerald-500/40">
          <i class="fa-solid fa-crown text-emerald-400"></i>
        </div>
        <div>
          <h1 class="text-sm font-bold tracking-wide">ELITE ZONE</h1>
          <p class="text-[11px] text-gray-400" id="user-display">লোড হচ্ছে...</p>
        </div>
      </div>
      <div class="flex items-center space-x-2">
        <div class="bg-slate-900 border border-slate-700 px-3 py-1.5 rounded-xl flex items-center space-x-1.5">
          <i class="fa-solid fa-wallet text-emerald-400 text-xs"></i>
          <span class="text-xs font-bold" id="wallet-balance">৳0</span>
        </div>
        <button onclick="openDepositModal()" class="btn-green text-[11px] px-2.5 py-1.5 rounded-xl font-bold flex items-center space-x-1 shadow-md">
          <i class="fa-solid fa-plus"></i>
          <span>Add</span>
        </button>
      </div>
    </header>

    <!-- সাপোর্ট বাটন -->
    <div class="mb-4">
      <a href="https://t.me/Jamil459" target="_blank" class="block w-full py-2 rounded-xl text-center text-xs font-bold bg-slate-900 border border-slate-800 text-gray-300 hover:text-white">
        <i class="fa-solid fa-headset text-emerald-400 mr-1.5"></i> অ্যাডমিন সাপোর্ট (@Jamil459)
      </a>
    </div>

    <!-- ফিল্টার ট্যাব -->
    <div class="flex space-x-2 mb-4">
      <button onclick="filterProducts('all')" id="tab-all" class="flex-1 py-1.5 text-xs font-bold rounded-xl bg-emerald-500 text-white">All</button>
      <button onclick="filterProducts('paid')" id="tab-paid" class="flex-1 py-1.5 text-xs font-bold rounded-xl bg-slate-800 text-gray-300">Paid Code</button>
      <button onclick="filterProducts('free')" id="tab-free" class="flex-1 py-1.5 text-xs font-bold rounded-xl bg-slate-800 text-gray-300">Free Code</button>
    </div>

    <!-- প্রোডাক্ট লিস্ট -->
    <div id="product-container" class="space-y-3">
      <p class="text-center text-xs text-gray-500 py-8">লোড হচ্ছে...</p>
    </div>
  </div>

  <!-- ==================== ডিপোজিট মোডাল ==================== -->
  <div id="deposit-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center hidden">
    <div class="bg-slate-900 w-full max-w-md p-5 rounded-t-3xl sm:rounded-2xl border border-slate-800 max-h-[90vh] overflow-y-auto">
      <div class="flex justify-between items-center mb-4">
        <h3 class="text-sm font-bold text-gray-200"><i class="fa-solid fa-coins text-amber-400 mr-2"></i> ওয়ালেট রিচার্জ করুন</h3>
        <button onclick="closeDepositModal()" class="text-gray-400 text-lg">&times;</button>
      </div>

      <div class="mb-4">
        <label class="text-[11px] text-gray-400 block mb-1">রিচার্জের পরিমাণ (BDT):</label>
        <input type="number" id="dep-amount" value="125" oninput="calculateUSDT()" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-emerald-500">
        <p class="text-[11px] text-emerald-400 mt-1" id="usdt-conversion-rate">Equivalent: $1.00 USDT</p>
      </div>

      <label class="text-[11px] text-gray-400 block mb-2">পেমেন্ট মেথড নির্বাচন করুন:</label>
      <div class="grid grid-cols-2 gap-2 mb-4" id="gateway-list"></div>

      <div id="payment-details-box" class="hidden bg-slate-800/60 p-3 rounded-xl border border-slate-700 mb-4"></div>

      <button id="deposit-confirm-btn" onclick="submitDeposit()" class="w-full btn-green py-2.5 rounded-xl font-bold text-xs tracking-wider shadow-lg hidden">
        পেমেন্ট নিশ্চিত করুন
      </button>
    </div>
  </div>

  <!-- ==================== ফ্রি কুপন আনলক মোডাল ==================== -->
  <div id="coupon-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
    <div class="bg-slate-900 w-full max-w-sm p-5 rounded-2xl border border-slate-800">
      <h3 class="text-sm font-bold text-white mb-2"><i class="fa-solid fa-gift text-pink-500 mr-2"></i> ফ্রি কুপন কোড দিন</h3>
      <p class="text-[11px] text-gray-400 mb-3" id="coupon-product-name">প্রোডাক্টের নাম</p>
      
      <input type="text" id="coupon-input" placeholder="কুপন কোড লিখুন..." class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white mb-3 focus:outline-none focus:border-emerald-500">
      
      <div class="flex space-x-2">
        <button onclick="closeCouponModal()" class="flex-1 py-2 rounded-xl text-xs bg-slate-800 text-gray-300">বাতিল</button>
        <button onclick="applyCoupon()" class="flex-1 py-2 rounded-xl text-xs btn-green text-white font-bold">আনলক করুন</button>
      </div>
    </div>
  </div>

  <script>
    // ১. আপনার বটের টোকেন ও চ্যানেল কনফিগারেশন
    const BOT_TOKEN = "9221828836:AAELkLm6npCwHGHT0jOIaZ3Nh7K1ij0Sy4s";
    const CHANNEL_USERNAME = "@DragonTGSupportGroup"; 

    // ২. ফায়ারবেস কনফিগ (পরবর্তীতে আপনার নিজের প্রোজেক্ট আইডি দিয়ে বদলাতে পারবেন)
    const firebaseConfig = {
      apiKey: "AIzaSyDummyKeyForNow",
      authDomain: "elite-zone-app.firebaseapp.com",
      projectId: "elite-zone-app",
      storageBucket: "elite-zone-app.appspot.com",
      messagingSenderId: "123456789",
      appId: "1:123456789:web:abcdef"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let tg = window.Telegram?.WebApp;
    if (tg) { tg.expand(); tg.ready(); }

    const telegramUser = tg?.initDataUnsafe?.user || { id: 7182227, first_name: "Demo User" };
    document.getElementById("user-display").innerText = telegramUser.first_name;

    let userBalance = 0;
    let dollarRate = 125;
    let paymentSettings = { bkash_enabled: true, bkash_number: "01828554448", nagad_enabled: true, nagad_number: "01828554448", binance_enabled: true, dollar_rate: 125 };
    let allProducts = [];
    let selectedGateway = null;
    let activeCouponProductId = null;

    // ================= FORCE JOIN ভেরিফিকেশন ইঞ্জিন =================
    async function checkMembership(showAlert = false) {
      const verifyBtn = document.getElementById("verify-btn");
      if (verifyBtn) verifyBtn.innerHTML = `<span>যাচাই করা হচ্ছে...</span>`;

      try {
        const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/getChatMember?chat_id=${CHANNEL_USERNAME}&user_id=${telegramUser.id}`);
        const res = await response.json();

        if (res.ok && ["creator", "administrator", "member"].includes(res.result.status)) {
          // ইউজার চ্যানেলে যুক্ত আছে!
          document.getElementById("force-join-screen").classList.add("hidden");
          document.getElementById("main-app").classList.remove("hidden");
          initUser();
          loadInitialData();
        } else {
          // চ্যানেলে যুক্ত নেই!
          document.getElementById("force-join-screen").classList.remove("hidden");
          document.getElementById("main-app").classList.add("hidden");
          if (showAlert) alert("❌ আপনি এখনো চ্যানেলে জয়েন করেননি! আগে জয়েন করুন।");
        }
      } catch (err) {
        // কোনো কারণে চেক ফেইল করলে অ্যাপ ওপেন হতে অনুমতি দেবে
        console.error(err);
        document.getElementById("force-join-screen").classList.add("hidden");
        document.getElementById("main-app").classList.remove("hidden");
        initUser();
        loadInitialData();
      } finally {
        if (verifyBtn) verifyBtn.innerHTML = `<i class="fa-solid fa-rotate-right"></i><span>🔄 জয়েন করেছি (Verify)</span>`;
      }
    }

    // ইউজার ইনিশিয়ালাইজ
    function initUser() {
      try {
        db.collection("users").doc(String(telegramUser.id)).onSnapshot(doc => {
          if (doc.exists) {
            userBalance = doc.data().balance || 0;
          } else {
            db.collection("users").doc(String(telegramUser.id)).set({
              name: telegramUser.first_name,
              balance: 0,
              created_at: firebase.firestore.FieldValue.serverTimestamp()
            });
          }
          document.getElementById("wallet-balance").innerText = `৳${userBalance}`;
        });
      } catch(e) { console.log(e); }
    }

    // ডেটা লোড ও রেন্ডার
    function loadInitialData() {
      try {
        db.collection("settings").doc("payments").onSnapshot(doc => {
          if (doc.exists) {
            paymentSettings = doc.data();
            dollarRate = paymentSettings.dollar_rate || 125;
          }
          renderGateways();
          calculateUSDT();
        });

        db.collection("products").onSnapshot(snapshot => {
          allProducts = [];
          snapshot.forEach(doc => allProducts.push({ id: doc.id, ...doc.data() }));
          if (allProducts.length === 0) setDemoProducts();
          else renderProducts(allProducts);
        });
      } catch(e) {
        setDemoProducts();
        renderGateways();
      }
    }

    function setDemoProducts() {
      allProducts = [
        { id: "1", name: "MINO SMS NUMBER BOT", price: 125, is_free: false, description: "সমস্ত সিস্টেম অটোমেটিক বট অ্যাড করে নিবে।", file_url: "https://t.me/DragonTGSupportGroup" },
        { id: "2", name: "FREE PROXY SOURCE CODE", price: 0, is_free: true, coupon_code: "FREE2025", description: "কুপন কোড দিয়ে সম্পূর্ণ ফ্রিতে ফাইলটি আনলক করুন।", file_url: "https://t.me/DragonTGSupportGroup" }
      ];
      renderProducts(allProducts);
    }

    function renderProducts(list) {
      const container = document.getElementById("product-container");
      container.innerHTML = "";

      list.forEach(p => {
        const isFree = p.is_free;
        const html = `
          <div class="card-gradient p-3.5 rounded-2xl relative overflow-hidden shadow">
            <div class="flex justify-between items-start mb-2">
              <span class="text-[10px] uppercase font-bold px-2 py-0.5 rounded-md ${isFree ? 'bg-pink-500/20 text-pink-400 border border-pink-500/30' : 'bg-amber-500/20 text-amber-400 border border-amber-500/30'}">
                ${isFree ? 'FREE CODE' : 'PAID CODE'}
              </span>
              <span class="text-xs font-extrabold text-white">${isFree ? '৳0 (FREE)' : '৳' + p.price}</span>
            </div>
            <h2 class="text-xs font-bold text-gray-100 mb-1">${p.name}</h2>
            <p class="text-[11px] text-gray-400 mb-3">${p.description || ''}</p>
            
            <button onclick="${isFree ? `openCouponModal('${p.id}', '${p.name}')` : `buyPaidCode('${p.id}', ${p.price})`}" 
              class="w-full py-2 rounded-xl text-xs font-bold ${isFree ? 'bg-slate-800 border border-pink-500/40 text-pink-400' : 'btn-green text-white'} flex items-center justify-center space-x-1.5">
              <i class="fa-solid ${isFree ? 'fa-key' : 'fa-cart-shopping'}"></i>
              <span>${isFree ? 'Unlock with Coupon' : `Buy Code • ৳${p.price}`}</span>
            </button>
          </div>
        `;
        container.innerHTML += html;
      });
    }

    function filterProducts(type) {
      document.querySelectorAll('[id^="tab-"]').forEach(el => el.className = "flex-1 py-1.5 text-xs font-bold rounded-xl bg-slate-800 text-gray-300");
      document.getElementById(`tab-${type}`).className = "flex-1 py-1.5 text-xs font-bold rounded-xl bg-emerald-500 text-white";

      if(type === 'all') renderProducts(allProducts);
      else if(type === 'paid') renderProducts(allProducts.filter(p => !p.is_free));
      else if(type === 'free') renderProducts(allProducts.filter(p => p.is_free));
    }

    function buyPaidCode(productId, price) {
      if (userBalance < price) {
        alert("আপনার পর্যাপ্ত ব্যালেন্স নেই! রিচার্জ করুন।");
        openDepositModal();
        return;
      }
      if (confirm(`৳${price} দিয়ে এই সোর্স কোডটি কিনতে চান?`)) {
        userBalance -= price;
        document.getElementById("wallet-balance").innerText = `৳${userBalance}`;
        const p = allProducts.find(item => item.id === productId);
        alert(`সফলভাবে ক্রয় সম্পন্ন হয়েছে! ডাউনলোড লিংক: ${p.file_url}`);
      }
    }

    function openCouponModal(id, name) {
      activeCouponProductId = id;
      document.getElementById("coupon-product-name").innerText = name;
      document.getElementById("coupon-modal").classList.remove("hidden");
    }
    function closeCouponModal() { document.getElementById("coupon-modal").classList.add("hidden"); }

    function applyCoupon() {
      const code = document.getElementById("coupon-input").value.trim();
      const product = allProducts.find(p => p.id === activeCouponProductId);
      if (product && product.coupon_code && product.coupon_code.toLowerCase() === code.toLowerCase()) {
        alert(`🎉 কোড আনলক সফল! ফাইল লিংক: ${product.file_url}`);
        closeCouponModal();
      } else {
        alert("❌ ভুল কুপন কোড!");
      }
    }

    function openDepositModal() { document.getElementById("deposit-modal").classList.remove("hidden"); }
    function closeDepositModal() { document.getElementById("deposit-modal").classList.add("hidden"); }

    function calculateUSDT() {
      const bdt = parseFloat(document.getElementById("dep-amount").value) || 0;
      const usdt = (bdt / dollarRate).toFixed(2);
      document.getElementById("usdt-conversion-rate").innerText = `Equivalent: $${usdt} USDT ($1 = ৳${dollarRate})`;
    }

    function renderGateways() {
      const list = document.getElementById("gateway-list");
      list.innerHTML = "";
      if (paymentSettings.bkash_enabled) {
        list.innerHTML += `<div onclick="selectGateway('bkash')" id="gw-bkash" class="card-gradient p-2.5 rounded-xl border border-slate-700 flex flex-col items-center cursor-pointer"><span class="text-xs font-bold text-pink-500">BKASH</span><span class="text-[9px] text-gray-400">Manual (5-10m)</span></div>`;
      }
      if (paymentSettings.nagad_enabled) {
        list.innerHTML += `<div onclick="selectGateway('nagad')" id="gw-nagad" class="card-gradient p-2.5 rounded-xl border border-slate-700 flex flex-col items-center cursor-pointer"><span class="text-xs font-bold text-orange-500">NAGAD</span><span class="text-[9px] text-gray-400">Manual (5-10m)</span></div>`;
      }
      if (paymentSettings.binance_enabled) {
        list.innerHTML += `<div onclick="selectGateway('binance')" id="gw-binance" class="card-gradient p-2.5 rounded-xl border border-slate-700 flex flex-col items-center cursor-pointer"><span class="text-xs font-bold text-yellow-400">BINANCE PAY</span><span class="text-[9px] text-emerald-400">Instant (1 Sec)</span></div>`;
      }
    }

    function selectGateway(type) {
      selectedGateway = type;
      document.querySelectorAll('[id^="gw-"]').forEach(el => el.classList.remove('border-emerald-500', 'bg-emerald-500/10'));
      document.getElementById(`gw-${type}`).classList.add('border-emerald-500', 'bg-emerald-500/10');

      const details = document.getElementById("payment-details-box");
      const confirmBtn = document.getElementById("deposit-confirm-btn");
      details.classList.remove("hidden");
      confirmBtn.classList.remove("hidden");

      if (type === 'bkash' || type === 'nagad') {
        const num = type === 'bkash' ? paymentSettings.bkash_number : paymentSettings.nagad_number;
        details.innerHTML = `
          <p class="text-[11px] text-gray-300 mb-1">Send Money করুন এই নাম্বারে:</p>
          <p class="text-xs font-bold text-emerald-400 select-all mb-2">${num}</p>
          <input type="text" id="manual-trx" placeholder="Transaction ID (TrxID) দিন" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-xs text-white mb-2">
        `;
      } else if (type === 'binance') {
        const bdt = parseFloat(document.getElementById("dep-amount").value) || 0;
        const usdt = (bdt / dollarRate).toFixed(2);
        details.innerHTML = `
          <p class="text-[11px] text-yellow-400 mb-1 font-bold">Binance Auto Payment (Instant)</p>
          <p class="text-[11px] text-gray-300">আপনাকে $${usdt} USDT পেমেন্ট করতে হবে। পেমেন্ট সম্পন্ন হলে অটোমেটিক ব্যালেন্স যোগ হবে।</p>
        `;
      }
    }

    function submitDeposit() {
      const amount = parseFloat(document.getElementById("dep-amount").value);
      if (selectedGateway === 'bkash' || selectedGateway === 'nagad') {
        const trx = document.getElementById("manual-trx")?.value.trim();
        if (!trx) return alert("TrxID দিন!");
        alert("আপনার রিকোয়েস্ট সফল হয়েছে! অ্যাডমিন যাচাই করে ব্যালেন্স যোগ করবেন।");
        closeDepositModal();
      } else if (selectedGateway === 'binance') {
        alert("বাইনান্স অটো পেমেন্ট পেজে রিডাইরেক্ট হচ্ছে...");
      }
    }

    // অ্যাপ চালু হওয়ার সাথে সাথে মেম্বারশিপ যাচাই
    checkMembership();
  </script>
</body>
</html>
